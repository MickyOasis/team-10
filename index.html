<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บแนะนำทีม</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- รอบที่ 3 (คาบหน้า): แก้ชื่อทีมตรงบรรทัดนี้ -->
  <h1 id="team-name">Team 10</h1>

  <!-- ===== รอบที่ 1: ทุกคนผลัดกันเพิ่มชื่อเล่นของตัวเอง ===== -->
  <h2>สมาชิก</h2>
  <ul id="member-list">
    <li>คนที่ 1: (มิกกี้้)</li>
    <li>คนที่ 2: (เหนือ)</li>
    <li>คนที่ 3: (ลีโอ)</li>
  </ul>

  <!-- ===== รอบที่ 2: คนที่ 1 (หัวหน้าทีม) ทำการ์ดให้ครบ 3 ใบ ===== -->
  <h2>รู้จักพวกเรา</h2>
  <div class="card-container">

    <!-- การ์ดตัวอย่าง: คัดลอกทั้งก้อนนี้ไปทำใบที่ 2 และ 3 -->
    <div class="card">
      <h3 class="card-name">มิกกี้</h3>
      <p class="card-role">ทำhtml</p>
      <p class="card-hobby">ดูบาส: ...</p>
    </div>

    <!-- การ์ดคนที่ 2 วางตรงนี้ -->
    <div class="card">
      <h3 class="card-name">เหนือ</h3>
      <p class="card-role">ทำcss</p>
      <p class="card-hobby">เล่นเกม: ...</p>
    </div>
    <!-- การ์ดคนที่ 3 วางตรงนี้ -->
    <div class="card">
      <h3 class="card-name">ลีโอ</h3>
      <p class="card-role">ทำJS</p>
      <p class="card-hobby">ดูหนัง: ...</p>
    </div>
  </div>

  <!-- ปุ่มสำหรับคนที่ 3 (โปรแกรมเมอร์) ห้ามลบ id -->
  <button id="hello-btn">ทักทาย</button>
  <button id="theme-btn">สลับโหมดมืด</button>
  <p id="message"></p>

  <script src="script.js"></script>
</body>
</html>
